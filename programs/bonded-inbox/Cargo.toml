[package]
name = "bonded-inbox-program"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
borsh = { version = "=1.6.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }

[profile.release]
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
