name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify dependency lock
        run: nix flake lock --no-update-lock-file

      - name: Run lifecycle tests
        run: nix develop --command bash scripts/run-unit-tests.sh

      - name: Run service boundary tests
        run: nix develop --command bash scripts/run-service-tests.sh

      - name: Run triage, A2A, and reliability tests
        run: nix develop --command bash scripts/run-second-half-tests.sh

      - name: Run default-skill conformance tests
        run: nix develop --command bash scripts/run-skill-runtime-tests.sh

      - name: Run CLI and Basecamp asset tests
        run: scripts/run-python-tests.sh

      - name: Run local performance qualification
        run: nix develop --command python3 tools/benchmark_local.py

      - name: Reject unsupported testnet traceability claims
        run: python3 tools/traceability_gate.py

      - name: Run bond program tests
        run: cargo test --locked --manifest-path programs/bonded-inbox/Cargo.toml

      - name: Check LEZ guest against pinned testnet ABI
        run: cargo check --locked --manifest-path programs/bonded-inbox/lez-guest/Cargo.toml

      - name: Generate Logos module bindings
        run: nix build .#generate -L

      - name: Build Logos Core plugin
        run: nix build .#lib -L

      - name: Build LGX package
        run: nix build .#lgx -L

      - name: Build Basecamp QML package
        run: nix build .#basecamp-lgx -L

      - name: Instantiate Basecamp owner UI
        run: nix run .#basecamp-preview-smoke

  real-proof-e2e:
    if: ${{ vars.ENABLE_REAL_PROOF_E2E == 'true' }}
    runs-on: [self-hosted, linux, x64, lez-real-proof]
    timeout-minutes: 180
    env:
      RISC0_DEV_MODE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Assert real proof mode
        run: test "$RISC0_DEV_MODE" = "0"

      - name: Build real LEZ settlement guest
        run: scripts/build-lez-program.sh

      - name: Run fail-closed evaluator environment
        run: scripts/evaluator-real.sh
